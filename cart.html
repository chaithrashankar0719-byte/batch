<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hearth & Co. – Cart</title>
<style>
*{box-sizing:border-box;margin:0}body{font-family:system-ui,sans-serif;background:#f5f7fa;color:#1b2a41}a{color:inherit;text-decoration:none}
header{background:#1b2a41;color:#fff;position:sticky;top:0}.bar{max-width:1100px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:20px}
.logo{font-weight:700;font-size:1.25rem;margin-right:auto}.cartbtn{background:#f2c14e;color:#1b2a41;padding:8px 14px;border-radius:6px;font-weight:600}
.badge{background:#1b2a41;color:#fff;border-radius:99px;padding:1px 8px;margin-left:6px;font-size:.85rem}
main{max-width:1100px;margin:auto;padding:32px 20px}h1{margin-bottom:16px}
.btn{display:inline-block;border:0;cursor:pointer;background:#2a6f97;color:#fff;padding:10px 18px;border-radius:6px;font:inherit;font-weight:600}
.alt{background:#f2c14e;color:#1b2a41}.ghost{background:#fff;color:#1b2a41;border:1px solid #dde3ea}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.card,.row,.sum{background:#fff;border:1px solid #dde3ea;border-radius:10px}
.card{overflow:hidden;display:flex;flex-direction:column}.thumb{height:160px;display:grid;place-items:center;font-size:4rem}
.info{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}.info .btn{margin-top:auto}.muted{color:#5c6b7c;font-size:.9rem}
.two{display:grid;grid-template-columns:2fr 1fr;gap:24px;align-items:start}
.row{display:flex;gap:14px;align-items:center;padding:12px;margin-bottom:12px}.row .thumb{width:70px;height:70px;font-size:2rem;border-radius:8px}.grow{flex:1}
.sum{padding:20px}.line{display:flex;justify-content:space-between;margin-bottom:8px}.tot{font-weight:700;font-size:1.2rem}
input,select,textarea{width:100%;padding:10px;border:1px solid #dde3ea;border-radius:6px;font:inherit;margin:4px 0 10px}
.hero{background:#1b2a41;color:#fff;border-radius:12px;padding:56px 32px;margin-bottom:32px}.hero p{margin:8px 0 24px;color:#c9d3df}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:32px}.detail .thumb{height:340px;font-size:8rem;border-radius:10px}
.empty{text-align:center;padding:60px 0}footer{text-align:center;padding:30px;color:#5c6b7c}
.toast{position:fixed;bottom:20px;right:20px;background:#1b2a41;color:#fff;padding:12px 18px;border-radius:8px;opacity:0;transition:.25s}.toast.show{opacity:1}
@media(max-width:760px){.two,.detail{grid-template-columns:1fr}}
</style></head>
<body>
<header><div class="bar"><a class="logo" href="index.html">Hearth &amp; Co.</a><a href="index.html">Home</a><a href="products.html">Shop</a><a class="cartbtn" href="cart.html">View cart<span class="badge">0</span></a></div></header>
<main><h1>Your cart</h1><div id="c"></div></main>
<footer>© 2026 Hearth &amp; Co.</footer>
<script>
const P=[
{id:1,name:"Ceramic Pour-Over Set",cat:"Kitchen",price:1899,i:"☕",bg:"#e8eef4",d:"Hand-glazed dripper and carafe for a clean, bright cup."},
{id:2,name:"Linen Throw Blanket",cat:"Living",price:2499,i:"🛋️",bg:"#f3ead2",d:"Stonewashed linen that softens with every wash."},
{id:3,name:"Brass Desk Lamp",cat:"Office",price:3299,i:"💡",bg:"#fbe9b7",d:"Adjustable arm and warm LED bulb for late-night work."},
{id:4,name:"Teak Serving Board",cat:"Kitchen",price:1299,i:"🪵",bg:"#ecd9c3",d:"Solid teak, oiled by hand. Big enough for a full spread."},
{id:5,name:"Stoneware Planter",cat:"Living",price:899,i:"🪴",bg:"#dcebdc",d:"Matte glaze planter with a drainage hole and saucer."},
{id:6,name:"Canvas Laptop Sleeve",cat:"Office",price:1499,i:"💼",bg:"#dfe4f1",d:"Water-resistant canvas with a soft felt lining."},
{id:7,name:"Soy Wax Candle",cat:"Living",price:699,i:"🕯️",bg:"#f2dfe3",d:"Cedar and fig scent. Burns for about 40 hours."},
{id:8,name:"Cast Iron Skillet",cat:"Kitchen",price:2199,i:"🍳",bg:"#e3e3e3",d:"Pre-seasoned 10-inch skillet that lasts generations."}];
const R=n=>"₹"+n.toLocaleString("en-IN"),$=s=>document.querySelector(s),find=id=>P.find(p=>p.id==id);
const get=()=>{try{return JSON.parse(localStorage.cart)||[]}catch(e){return[]}};
const badge=()=>$(".badge").textContent=get().reduce((s,x)=>s+x.q,0);
const save=c=>{try{localStorage.cart=JSON.stringify(c)}catch(e){}badge();window.render&&render()};
function add(id,q=1){const c=get(),i=c.find(x=>x.id==id);i?i.q+=q:c.push({id,q});save(c);toast(find(id).name+" added to cart")}
function setQ(id,q){save(q<1?get().filter(x=>x.id!=id):get().map(x=>x.id==id?{...x,q}:x))}
const total=()=>get().reduce((s,x)=>s+x.q*find(x.id).price,0);
function toast(m){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";document.body.append(t)}t.textContent=m;t.classList.add("show");clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove("show"),1800)}

// ---- page code ----
function render(){
  const c=get(),e=$("#c");
  if(!c.length){e.innerHTML=`<div class="empty"><p class="muted">Your cart is empty.</p><br><a class="btn" href="products.html">Start shopping</a></div>`;return}
  const sub=total(),ship=sub>=2999?0:99;
  e.innerHTML=`<div class="two"><div>${c.map(x=>{const p=find(x.id);return `<div class="row"><div class="thumb" style="background:${p.bg}">${p.i}</div>
  <div class="grow"><b>${p.name}</b><div class="muted">${R(p.price)} each</div></div>
  <button class="btn ghost" onclick="setQ(${p.id},${x.q-1})">−</button><b>${x.q}</b><button class="btn ghost" onclick="setQ(${p.id},${x.q+1})">+</button>
  <b>${R(p.price*x.q)}</b><button class="btn ghost" onclick="setQ(${p.id},0)">Remove</button></div>`}).join("")}</div>
  <div class="sum"><h2>Summary</h2><br>
  <div class="line"><span>Subtotal</span><span>${R(sub)}</span></div>
  <div class="line"><span>Shipping</span><span>${ship?R(ship):"Free"}</span></div>
  <div class="line tot"><span>Total</span><span>${R(sub+ship)}</span></div><br>
  <a class="btn alt" href="checkout.html">Checkout</a><p class="muted" style="margin-top:10px">Free shipping above ₹2,999.</p></div></div>`;
}
render();badge();
</script>
</body></html>
